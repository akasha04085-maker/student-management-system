<!DOCTYPE html>
<html>
    <head>
        <title>Student List</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Student List</h1>
            <table border="1" cellpadding="10" cellspacing="0">
                <tr>
                    <th>id</th>
                    <th>name</th>
                    <th>age</th>
                    <th>course</th>
                    <th>Action</th>
                </tr>
                {% for student in students %}
                <tr>
                    <td>{{ student[0] }}</td>
                    <td>{{ student[1] }}</td>
                    <td>{{ student[2] }}</td>
                    <td>{{ student[3] }}</td>

                <td>
                    <a href="/edit/{{ student[0] }}">
                        <button>Edit</button>
                    </a>
                </td>
                        

                <td>
                    <a href="/delete/{{ student[0] }}">
                        <button>Delete</button>
                    </a>
                </td>
                </tr>

                {% endfor %}
            </table>
    </body>
