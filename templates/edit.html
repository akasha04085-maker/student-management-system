<!DOCTYPE html>
<html>
    <head>
        <title>Edite student</title>
    </head>
    <body>
        <h1>Edit student</h1>
        <form method="POST">
            <label>Name</label>
            <input type="text"
                    name="name"
                    value="{{ student[1] }}">
                    <br><br>
            <label>Age</label>
            <input type="number"
                    name="age"
                    value="{{ student[2] }}">
                    <br><br>
            <label>Course</label>
            <input type="text"
                    name="course"
                    value={{ student[3] }}>
                    <br><br>
            <button type="submit">update student</button>
        </form>
    </body>
    </html>
